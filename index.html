<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAT DROP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --col1: #ff2d78;
    --col2: #ffcc00;
    --col3: #00e5ff;
    --col4: #7c3aed;
    --bg: #050510;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(0,229,255,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  #screen {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 500px;
    height: 100vh;
  }

  /* ── SHARED OVERLAY ── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,16,0.92);
    z-index: 20;
    gap: 20px;
    padding: 30px;
    text-align: center;
  }

  .overlay.hidden { display: none; }

  .overlay h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.5rem;
    font-weight: 900;
    background: linear-gradient(90deg, var(--col1), var(--col3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    letter-spacing: 0.05em;
  }

  .overlay h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--col2);
    letter-spacing: 0.1em;
  }

  .overlay p {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.6);
    line-height: 1.7;
    max-width: 320px;
  }

  /* ── BUTTONS ── */
  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 14px 40px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--col1), var(--col4));
    color: #fff;
    box-shadow: 0 0 30px rgba(255,45,120,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 45px rgba(255,45,120,0.6);
  }

  .btn-ghost {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 10px 28px;
    border-radius: 50px;
    border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer;
    background: transparent;
    color: rgba(255,255,255,0.5);
    transition: all 0.2s;
  }

  .btn-ghost:hover {
    border-color: rgba(255,255,255,0.5);
    color: rgba(255,255,255,0.9);
  }

  /* ── DIVIDER ── */
  .divider {
    width: 100%;
    max-width: 320px;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  /* ── MAIN MENU SPECIFIC ── */
  #mainMenu .tagline {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }

  #mainMenu .menu-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  /* animated scanline on main menu */
  #mainMenu::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--col3), transparent);
    opacity: 0.3;
    animation: scanline 4s linear infinite;
    pointer-events: none;
  }

  @keyframes scanline {
    0%   { top: 0%; }
    100% { top: 100%; }
  }

  /* ── LEVEL SELECT ── */
  #levelSelect {
    justify-content: flex-start;
    padding-top: 0;
    gap: 0;
  }

  .level-select-header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 20px 16px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    background: transparent;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .back-btn:hover {
    border-color: var(--col3);
    color: var(--col3);
  }

  .level-select-header h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.5);
  }

  .song-list {
    width: 100%;
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .song-list::-webkit-scrollbar { width: 4px; }
  .song-list::-webkit-scrollbar-track { background: transparent; }
  .song-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  /* ── SONG CARD ── */
  .song-card {
    width: 100%;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    padding: 16px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }

  .song-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 14px 14px 0 0;
    background: var(--card-accent);
    opacity: 0.6;
    transition: opacity 0.15s;
  }

  .song-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .song-card:hover::before { opacity: 1; }

  .song-card:active { transform: scale(0.98); }

  .song-icon {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
    background: var(--card-accent-bg);
    border: 1px solid var(--card-accent-border);
  }

  .song-info {
    flex: 1;
    text-align: left;
    min-width: 0;
  }

  .song-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.05em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-artist {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .song-meta {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .song-tag {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .song-tag.bpm { color: var(--card-accent-text); border-color: var(--card-accent-border); }

  .song-arrow {
    color: rgba(255,255,255,0.2);
    font-size: 1rem;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }

  .song-card:hover .song-arrow {
    color: rgba(255,255,255,0.6);
    transform: translateX(3px);
  }

  /* ── SONG CONFIG (existing per-song menu) ── */
  #songConfig {
    gap: 20px;
  }

  #songConfig .config-song-name {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

  /* ── KEY MAP ── */
  .key-map {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 320px;
  }

  .key-chip {
    padding: 10px 4px;
    border-radius: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    border: 2px solid;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .key-chip span { font-size: 0.55rem; font-family: 'Share Tech Mono', monospace; opacity: 0.7; }
  .key-chip:nth-child(1) { border-color: var(--col1); color: var(--col1); background: rgba(255,45,120,0.1); }
  .key-chip:nth-child(2) { border-color: var(--col2); color: var(--col2); background: rgba(255,204,0,0.1); }
  .key-chip:nth-child(3) { border-color: var(--col3); color: var(--col3); background: rgba(0,229,255,0.1); }
  .key-chip:nth-child(4) { border-color: var(--col4); color: var(--col4); background: rgba(124,58,237,0.1); }

  /* ── DIFFICULTY ── */
  .diff-select { display: flex; gap: 10px; }

  .diff-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 8px 18px;
    border-radius: 50px;
    border: 2px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.2s;
  }

  .diff-btn:hover { border-color: var(--col3); color: var(--col3); }
  .diff-btn.active {
    border-color: var(--col2); color: var(--col2);
    background: rgba(255,204,0,0.1);
    box-shadow: 0 0 12px rgba(255,204,0,0.3);
  }

  /* ── NO LIVES TOGGLE ── */
  .toggle-row {
    display: flex; align-items: center; gap: 12px;
    font-size: 0.8rem; color: rgba(255,255,255,0.5); letter-spacing: 0.05em;
  }

  .toggle {
    width: 40px; height: 22px; border-radius: 11px;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    position: relative; cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .toggle::after {
    content: ''; position: absolute;
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    top: 2px; left: 2px;
    transition: transform 0.2s, background 0.2s;
  }

  .toggle.on { background: rgba(0,229,255,0.2); border-color: var(--col3); }
  .toggle.on::after { transform: translateX(18px); background: var(--col3); }

  /* ── SCREEN TRANSITIONS ── */
  .overlay {
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .overlay.slide-out-left {
    animation: slideOutLeft 0.2s ease forwards;
  }

  .overlay.slide-in-right {
    animation: slideInRight 0.2s ease forwards;
  }

  .overlay.slide-out-right {
    animation: slideOutRight 0.2s ease forwards;
  }

  .overlay.slide-in-left {
    animation: slideInLeft 0.2s ease forwards;
  }

  @keyframes slideOutLeft {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-40px); }
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes slideOutRight {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(40px); }
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-40px); }
    to   { opacity: 1; transform: translateX(0); }
  }
</style>

<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="screen">

  <!-- ══════════════════════════════════════
       SCREEN 1: MAIN MENU
  ══════════════════════════════════════ -->
  <div class="overlay" id="mainMenu">
    <h1>BEAT DROP</h1>
    <h2>RHYTHM GAME</h2>

    <div class="divider"></div>

    <div class="menu-actions">
      <button class="btn" id="selectSongBtn">SELECT SONG</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       SCREEN 2: LEVEL SELECT
  ══════════════════════════════════════ -->
  <div class="overlay hidden" id="levelSelect">
    <div class="level-select-header">
      <button class="back-btn" id="backToMainBtn">&#8592;</button>
      <h2>SELECT SONG</h2>
    </div>
    <div class="song-list" id="songList">
      <!-- Song cards injected by JS -->
    </div>
  </div>

  <!-- ══════════════════════════════════════
       SCREEN 3: SONG CONFIG (per-song menu)
  ══════════════════════════════════════ -->
  <div class="overlay hidden" id="songConfig">
    <div class="config-song-name" id="configSongName"></div>
    <h2 id="configSongTitle"></h2>

    <p>Hit notes as they reach the bottom.<br>Don't miss — you only have 4 lives.</p>

    <div class="key-map">
      <div class="key-chip">D<span>LANE 1</span></div>
      <div class="key-chip">F<span>LANE 2</span></div>
      <div class="key-chip">J<span>LANE 3</span></div>
      <div class="key-chip">K<span>LANE 4</span></div>
    </div>

    <div class="divider"></div>

    <div class="diff-select" id="diffSelect">
      <button class="diff-btn" data-diff="easy">EASY</button>
      <button class="diff-btn active" data-diff="medium">MEDIUM</button>
      <button class="diff-btn" data-diff="hard">HARD</button>
    </div>

    <div class="toggle-row">
      <div class="toggle" id="noLivesToggle"></div>
      NO LIVES MODE
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="playBtn">PLAY</button>
      <button class="btn-ghost" id="backToLevelSelectBtn">BACK</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       GAME AREA
  ══════════════════════════════════════ -->
  <div id="gameArea">
    <div id="hud">
      <div id="scoreDisplay">0</div>
      <div id="multiplierWrap">
        <div id="multiplierDisplay">x1</div>
        <div id="multiplierTrack">
          <div id="multiplierBar"></div>
        </div>
      </div>
    </div>
    <div id="track"></div>
    <div id="buttons">
      <button class="lane-btn" data-lane="0">D</button>
      <button class="lane-btn" data-lane="1">F</button>
      <button class="lane-btn" data-lane="2">J</button>
      <button class="lane-btn" data-lane="3">K</button>
    </div>
  </div>

</div><!-- end #screen -->

<script src="game.js"></script>
</body>
</html>
